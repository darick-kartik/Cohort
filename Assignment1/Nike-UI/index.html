<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- NAVBAR -->

    <nav class="navbar">

        <h1 class="logo">NIKE</h1>

        <ul>
            <li>Home</li>
            <li>Shop</li>
            <li>Collection</li>
            <li>Contact</li>
        </ul>

        <button class="nav-btn">Cart</button>

    </nav>

    <!-- MAIN -->

    <div class="main">

        <!-- LEFT -->

        <div class="left">

            <h1>
                NIKE <br>
                AIR
            </h1>

            <p>
                Premium quality sneakers with modern style and comfort.
                Perfect for everyday fashion and sports wear.
            </p>

            <div class="sizes">

                <div class="size active">7</div>
                <div class="size">8</div>
                <div class="size">9</div>
                <div class="size">10</div>

            </div>

            <button class="bag-btn">
                ADD TO BAG
            </button>

        </div>

        <!-- MIDDLE -->

        <div class="middle">

            <div class="image">
                <img src="./shoe1.png" alt="">
            </div>

            <div class="price">
                $200
            </div>

            <div class="rating">
                ★ 4.9
            </div>

        </div>

        <!-- RIGHT -->

        <div class="right">

            <div class="box">
                <img src="./shoe1.png" alt="">
            </div>

            <div class="box">
                <img src="./shoe2.png" alt="">
            </div>

            <div class="box">
                <img src="./shoe3.png" alt="">
            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        <div class="feature">
            🚚 Free Delivery
        </div>

        <div class="feature">
            🔒 Secure Payment
        </div>

        <div class="feature">
            ↩ Easy Returns
        </div>

    </div>

</div>

</body>
</html>
