<!-- Pokemon UI Project -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main">

        <!-- Top Section -->
        <div class="top">

            <div class="logo">
                <img src="./asset/logo.png" alt="pokemon-logo">
            </div>

            <div class="menu">
                <img src="./asset/menu.png" alt="menu-icon">
            </div>

        </div>


        <!-- Content Section -->
        <div class="content-section">

            <!-- Left Content -->
            <div class="left">

                <span class="subtitle">POKEMON GEN I</span>

                <h1>Pikachu</h1>

               <p>
    Pikachu is a cheerful Electric-type Pokémon that
    stores powerful electricity inside its cheeks and
    releases it during battles with incredible energy.
</p>

                <div class="footer">
                    <span>13/05</span>
                </div>

            </div>


            <!-- Right Content -->
            <div class="right">

                <div class="image-box">
                    <img src="./asset/pik.png" alt="pikachu-image">
                </div>

                <div class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
