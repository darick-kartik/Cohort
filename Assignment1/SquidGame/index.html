<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <!-- ================= NAVBAR ================= -->

        <div class="nav">

            <div class="leftnav">
                <img src="./asset/logo.png" alt="logo">
            </div>

            <div class="middlenav">
                <a href="#">About</a>
                <a href="#">Watch Now</a>
                <a href="#">Actors</a>
                <a href="#">Contact</a>
            </div>

            <div class="rightnav">
                <img src="./asset/menu.png" alt="menu">
            </div>

        </div>



        <!-- ================= HERO ================= -->

        <div class="hero">


            <!-- LEFT -->

            <div class="lefthero">

                <h1>
                    SQUID <br>
                    GAME
                </h1>

                <p>
                    Action / Thriller / Drama Series directed by
                    Dong-hyuk Hwang
                </p>

                <div class="buttons">

                    <button class="playbtn">
                        Play Now
                    </button>

                    <button class="trailerbtn">
                        Watch Trailer
                    </button>

                </div>

            </div>



            <!-- SCROLL -->

            <div class="scrolltext">
                <h3>SCROLL</h3>
            </div>



            <!-- RIGHT -->

            <div class="righthero">

                <img src="./asset/ch.png" alt="character">

            </div>

        </div>


        



        <!-- ================= BACKGROUND TEXT ================= -->

        <div class="bgtext">
            <h1>GAME</h1>
        </div>



        <!-- ================= CARDS ================= -->

        <div class="cards">

            <div class="card">
                <img src="./asset/image1.png" alt="image1">
            </div>

            <div class="card">
                <img src="./asset/image2.png" alt="image2">
            </div>

            <div class="card">
                <img src="./asset/image3.png" alt="image3">
            </div>

        </div>

    </div>

</body>
</html>
